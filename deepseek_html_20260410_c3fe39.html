<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>VORTEX | Киберспортивная команда по CS2</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #05070a;
            font-family: 'Inter', sans-serif;
            color: #eef5ff;
            line-height: 1.5;
            scroll-behavior: smooth;
            overflow-x: hidden;
        }

        /* Абстрактный вихрь / туман на фоне */
        .vortex-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: radial-gradient(circle at 20% 30%, #0a0f1f, #020408);
            overflow: hidden;
        }

        .vortex-bg::before {
            content: "";
            position: absolute;
            width: 150%;
            height: 150%;
            top: -25%;
            left: -25%;
            background: repeating-radial-gradient(circle at 40% 50%, rgba(0, 255, 255, 0.03) 0px, rgba(80, 0, 255, 0.05) 2px, transparent 4px);
            animation: swirl 35s infinite linear;
            filter: blur(40px);
        }

        .vortex-bg::after {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" opacity="0.15"><path fill="none" stroke="%234466ff" stroke-width="0.8" d="M0,400 Q300,100 600,400 T1200,400" /><path fill="none" stroke="%23b477ff" stroke-width="0.6" d="M200,600 Q500,200 800,600 T1100,300" /></svg>');
            background-size: cover;
            opacity: 0.3;
            mix-blend-mode: overlay;
        }

        @keyframes swirl {
            0% { transform: rotate(0deg) scale(1); opacity: 0.6; }
            100% { transform: rotate(360deg) scale(1.2); opacity: 0.9; }
        }

        /* Стекло и неон */
        .glass-card {
            background: rgba(10, 20, 30, 0.55);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 255, 255, 0.2);
            border-radius: 28px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5), 0 0 12px rgba(0, 180, 255, 0.2);
            transition: all 0.3s ease;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* Hero секция */
        .hero {
            min-height: 90vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            padding: 80px 0 60px;
        }

        .logo {
            font-family: 'Orbitron', monospace;
            font-size: clamp(3.5rem, 12vw, 7rem);
            font-weight: 900;
            letter-spacing: 6px;
            background: linear-gradient(135deg, #aaffff, #7a4eff, #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 12px #00ccff88, 0 0 25px #3a0ca3;
            animation: neonPulse 2s infinite alternate;
        }

        @keyframes neonPulse {
            0% { text-shadow: 0 0 2px cyan, 0 0 8px #3a0ca3; opacity: 0.95; }
            100% { text-shadow: 0 0 14px cyan, 0 0 28px #b77cff, 0 0 5px white; opacity: 1; }
        }

        .slogan {
            font-size: 1.4rem;
            letter-spacing: 2px;
            font-weight: 400;
            border-top: 1px solid cyan;
            display: inline-block;
            padding-top: 12px;
            color: #ccddf8;
        }

        .btn-neon {
            display: inline-block;
            background: rgba(0, 20, 40, 0.7);
            border: 1.5px solid #0cf;
            color: #0cf;
            padding: 12px 32px;
            font-family: 'Orbitron', monospace;
            font-weight: bold;
            border-radius: 60px;
            backdrop-filter: blur(5px);
            transition: 0.25s;
            cursor: pointer;
            font-size: 1.1rem;
            box-shadow: 0 0 8px cyan;
        }

        .btn-neon:hover {
            background: #0cf;
            color: #010101;
            box-shadow: 0 0 20px cyan;
            transform: scale(1.03);
            border-color: white;
        }

        /* Секции */
        section {
            padding: 70px 0;
        }

        .section-title {
            font-family: 'Orbitron', monospace;
            font-size: 2.5rem;
            margin-bottom: 48px;
            text-align: center;
            background: linear-gradient(120deg, #fff, #7aa2f7);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
            border-left: 4px solid #0cf;
            display: inline-block;
            padding-left: 20px;
            width: auto;
        }

        /* roster grid */
        .roster-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 30px;
        }

        .player-card {
            background: linear-gradient(145deg, rgba(15, 25, 45, 0.7), rgba(5, 10, 20, 0.8));
            backdrop-filter: blur(8px);
            border-radius: 32px;
            padding: 20px 16px 24px;
            text-align: center;
            transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            border: 1px solid rgba(0, 255, 255, 0.3);
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }

        .player-card:hover {
            transform: translateY(-12px);
            border-color: #0cf;
            box-shadow: 0 0 28px rgba(0, 204, 255, 0.5), 0 12px 24px black;
            background: rgba(10, 30, 55, 0.8);
        }

        .player-img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 16px;
            border: 3px solid #0cf;
            box-shadow: 0 0 12px cyan;
            transition: 0.2s;
            background: #111a28;
        }

        .player-flag {
            font-size: 1.8rem;
            display: inline-block;
            margin-bottom: 6px;
            filter: drop-shadow(0 0 4px rgba(0, 204, 255, 0.5));
        }

        .player-nick {
            font-family: 'Orbitron', monospace;
            font-size: 1.7rem;
            font-weight: 800;
            background: linear-gradient(145deg, #f0f9ff, #a0c0ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .player-name {
            font-size: 0.85rem;
            opacity: 0.7;
            letter-spacing: 0.5px;
        }

        .player-role {
            display: inline-block;
            background: #0cf20d1a;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: bold;
            color: #6ee7ff;
            border-left: 2px solid cyan;
            margin-top: 12px;
        }

        /* Новости */
        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 28px;
        }

        .news-card {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            border-radius: 28px;
            padding: 24px;
            border-left: 5px solid #7b2cbf;
            transition: 0.2s;
        }

        .news-card:hover {
            transform: scale(1.01);
            border-left-color: cyan;
            background: rgba(10, 20, 45, 0.7);
        }

        .news-date {
            font-size: 0.8rem;
            color: #0cf;
            font-weight: 500;
        }

        .news-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 10px 0;
        }

        /* matches cards */
        .matches-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .match-item {
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(8px);
            border-radius: 60px;
            padding: 14px 24px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #2c3e66;
            transition: 0.2s;
        }

        .match-badge {
            background: #ff4d4d;
            color: white;
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 0.7rem;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .match-badge.live {
            background: #00e676;
            color: #000;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0% { opacity: 1; background: #0f0; box-shadow: 0 0 4px lime; }
            100% { opacity: 0.8; background: #2eff7a; }
        }

        /* Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 30px;
            text-align: center;
        }

        .stat-item {
            background: rgba(0, 20, 40, 0.65);
            backdrop-filter: blur(8px);
            padding: 28px 12px;
            border-radius: 40px;
            border: 1px solid rgba(0, 204, 255, 0.3);
        }

        .stat-number {
            font-family: 'Orbitron', monospace;
            font-size: 3rem;
            font-weight: 800;
            color: #0cf;
            text-shadow: 0 0 8px cyan;
        }

        /* footer */
        .footer {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(12px);
            border-top: 1px solid cyan;
            padding: 48px 0 32px;
            margin-top: 20px;
        }

        .social-icons a {
            color: #ccf4ff;
            font-size: 2rem;
            margin: 0 18px;
            transition: 0.2s;
            display: inline-block;
        }

        .social-icons a:hover {
            color: #0cf;
            transform: translateY(-5px);
            text-shadow: 0 0 12px cyan;
        }

        /* адаптивность mobile first */
        @media (max-width: 768px) {
            .container {
                padding: 0 18px;
            }
            .section-title {
                font-size: 1.8rem;
            }
            .match-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
                border-radius: 28px;
                padding: 18px;
            }
            .player-nick {
                font-size: 1.3rem;
            }
            .btn-neon {
                padding: 8px 22px;
            }
        }

        @media (max-width: 480px) {
            .roster-grid {
                gap: 20px;
            }
            .stat-number {
                font-size: 2.2rem;
            }
        }

        /* рендер фото-заглушки (стиль киберпанк) */
        .placeholder-img {
            background: linear-gradient(145deg, #142c3c, #07111c);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-family: monospace;
            color: #0cf;
        }
    </style>
</head>
<body>
<div class="vortex-bg"></div>

<main>
    <!-- Hero -->
    <div class="hero">
        <div class="container" style="text-align: center;">
            <h1 class="logo">VORTEX</h1>
            <p class="slogan" style="margin: 20px 0 30px;">⚡ Разрушаем тишину ⚡</p>
            <button id="sponsorBtn" class="btn-neon">💎 Спонсорам</button>
        </div>
    </div>

    <!-- Roster (обновленный состав с флагами) -->
    <section>
        <div class="container">
            <div style="text-align: center;"><h2 class="section-title">🌀 СОСТАВ • ROSTER</h2></div>
            <div class="roster-grid" id="rosterGrid"></div>
        </div>
    </section>

    <!-- News -->
    <section style="background: radial-gradient(ellipse at top, rgba(0,20,40,0.3), transparent);">
        <div class="container">
            <div style="text-align: center;"><h2 class="section-title">📰 ПОСЛЕДНИЕ НОВОСТИ</h2></div>
            <div class="news-grid" id="newsGrid"></div>
        </div>
    </section>

    <!-- Matches -->
    <section>
        <div class="container">
            <div style="text-align: center;"><h2 class="section-title">🗓️ РАСПИСАНИЕ МАТЧЕЙ</h2></div>
            <div class="matches-list" id="matchesList"></div>
        </div>
    </section>

    <!-- Stats -->
    <section>
        <div class="container">
            <div style="text-align: center;"><h2 class="section-title">📊 СТАТИСТИКА КОМАНДЫ</h2></div>
            <div class="stats-grid" id="statsGrid"></div>
        </div>
    </section>
</main>

<!-- Footer -->
<footer class="footer">
    <div class="container" style="text-align: center;">
        <div class="social-icons">
            <a href="#" target="_blank" aria-label="Twitch"><i class="fab fa-twitch"></i></a>
            <a href="#" target="_blank" aria-label="Twitter"><i class="fab fa-twitter"></i></a>
            <a href="#" target="_blank" aria-label="Discord"><i class="fab fa-discord"></i></a>
        </div>
        <p style="margin: 28px 0 12px; letter-spacing: 1px;">📧 Контакты для спонсоров: <strong style="color:#0cf;">pr@vortex.gg</strong></p>
        <p style="font-size: 0.75rem; opacity: 0.6;">© 2025 VORTEX GAMING — Вихрь не остановить</p>
    </div>
</footer>

<script>
    // НОВЫЙ СОСТАВ КОМАНДЫ (с флагами)
    const players = [
        { nick: "56k", realName: "Jere", role: "Капитан", flag: "🇩🇰", country: "Дания", imgSeed: "56kcap" },
        { nick: "Ka1eveZy", realName: "Roman", role: "Entry Fragger", flag: "🇷🇺", country: "Россия", imgSeed: "ka1evezy" },
        { nick: "Sirez", realName: "Jere", role: "Снайпер (AWPer)", flag: "🇫🇮", country: "Финляндия", imgSeed: "sirez" },
        { nick: "k1NGZY", realName: "Ilya", role: "Луркер", flag: "🇷🇺", country: "Россия", imgSeed: "kingzy" },
        { nick: "Apostol", realName: "Sergei", role: "Саппорт", flag: "🇷🇺", country: "Россия", imgSeed: "apostol" }
    ];

    // Функция генерации уникальных SVG-заглушек с абстрактным кибер-лицом
    function generateAvatarSVG(seed, nameSeed) {
        const colors = ['#1a2a4f', '#2a1e44', '#0f2a3a', '#1f2c46', '#2d1f55'];
        const accent = '#0cf';
        // делаем стабильный выбор по нику
        let hash = 0;
        for (let i = 0; i < seed.length; i++) {
            hash = ((hash << 5) - hash) + seed.charCodeAt(i);
            hash |= 0;
        }
        const index = Math.abs(hash % colors.length);
        const finalBg = colors[index];
        const initial = seed.charAt(0).toUpperCase();
        return `data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Ccircle cx='100' cy='100' r='100' fill='${finalBg}'/%3E%3Cpath fill='${accent}' opacity='0.5' d='M60,70 L140,70 L130,130 L70,130 Z'/%3E%3Ccircle cx='75' cy='95' r='8' fill='white'/%3E%3Ccircle cx='125' cy='95' r='8' fill='white'/%3E%3Cpath d='M85 125 Q100 140 115 125' stroke='${accent}' stroke-width='4' fill='none' stroke-linecap='round' /%3E%3Ctext x='100' y='175' font-size='18' text-anchor='middle' fill='${accent}' font-family='monospace'%3E${initial}%3C/text%3E%3C/svg%3E`;
    }

    // Новости
    const newsData = [
        { title: "Vortex выходит в плей-офф ESEA Season 50", date: "12 мая 2025", desc: "Убедительная победа над TOP5 командой региона, исторический выход в плей-офф." },
        { title: "Обновление тактики: разбор победы над Fnatic", date: "8 мая 2025", desc: "Анализ ключевых моментов и новая стратегия на Overpass от капитана 56k." },
        { title: "Sirez вошел в топ-10 снайперов региона", date: "2 мая 2025", desc: "Впечатляющая статистика 1.42 K/D, лучший момент турнира." }
    ];

    // Матчи
    const matches = [
        { opponent: "Team Spirit", date: "15 мая, 19:00 МСК", status: "Live", isLive: true },
        { opponent: "NAVI Junior", date: "17 мая, 21:00 МСК", status: "Предстоящий", isLive: false },
        { opponent: "GamerLegion", date: "20 мая, 20:30 МСК", status: "Предстоящий", isLive: false }
    ];

    // Статистика
    const stats = [
        { label: "Побед", value: "72%", suffix: "" },
        { label: "Карт сыграно", value: "158", suffix: "" },
        { label: "Призовые", value: "$42,000", suffix: "" },
        { label: "Рекордная серия", value: "12", suffix: " побед" }
    ];

    // Рендер игроков (с флагами)
    function renderRoster() {
        const rosterContainer = document.getElementById('rosterGrid');
        rosterContainer.innerHTML = '';
        players.forEach(p => {
            const avatarUrl = generateAvatarSVG(p.imgSeed + p.nick, p.nick);
            const card = document.createElement('div');
            card.className = 'player-card';
            card.innerHTML = `
                <img class="player-img" src="${avatarUrl}" alt="${p.nick}" loading="lazy">
                <div class="player-flag" title="${p.country}">${p.flag}</div>
                <div class="player-nick">${p.nick}</div>
                <div class="player-name">${p.realName}</div>
                <div class="player-role">⚡ ${p.role}</div>
            `;
            rosterContainer.appendChild(card);
        });
    }

    // Новости
    function renderNews() {
        const newsContainer = document.getElementById('newsGrid');
        newsContainer.innerHTML = '';
        newsData.forEach(n => {
            const card = document.createElement('div');
            card.className = 'news-card';
            card.innerHTML = `
                <div class="news-date"><i class="far fa-calendar-alt"></i> ${n.date}</div>
                <div class="news-title">${n.title}</div>
                <p style="opacity:0.8; margin-top:12px;">${n.desc}</p>
                <div style="margin-top:20px;"><span style="color:#0cf;">➤ Читать далее</span></div>
            `;
            newsContainer.appendChild(card);
        });
    }

    // Расписание
    function renderMatches() {
        const matchContainer = document.getElementById('matchesList');
        matchContainer.innerHTML = '';
        matches.forEach(m => {
            const matchDiv = document.createElement('div');
            matchDiv.className = 'match-item';
            matchDiv.innerHTML = `
                <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
                    <strong style="font-size:1.2rem;">🆚 VORTEX vs ${m.opponent}</strong>
                    <span style="background:#0a1a2f; padding:4px 12px; border-radius:20px;"><i class="far fa-clock"></i> ${m.date}</span>
                </div>
                <div>
                    ${m.isLive ? '<span class="match-badge live">🔴 LIVE</span>' : '<span class="match-badge">📅 ' + m.status + '</span>'}
                </div>
            `;
            matchContainer.appendChild(matchDiv);
        });
    }

    // Статистика
    function renderStats() {
        const statsContainer = document.getElementById('statsGrid');
        statsContainer.innerHTML = '';
        stats.forEach(stat => {
            const statItem = document.createElement('div');
            statItem.className = 'stat-item';
            statItem.innerHTML = `
                <div class="stat-number">${stat.value}</div>
                <div style="font-weight:500; letter-spacing:1px;">${stat.label}</div>
                ${stat.suffix ? `<div style="font-size:0.7rem;">${stat.suffix}</div>` : ''}
            `;
            statsContainer.appendChild(statItem);
        });
    }

    // Алерт для кнопки спонсорам
    function setupSponsorButton() {
        const btn = document.getElementById('sponsorBtn');
        if (btn) {
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                alert('📧 Почта для партнерства: pr@vortex.gg\nБудем рады сотрудничеству!');
            });
        }
    }

    // Эффект мерцания неона уже в CSS, дополнительный стиль
    function setDynamicStyles() {
        const style = document.createElement('style');
        style.textContent = `
            ::selection {
                background: #0cf;
                color: black;
            }
            .player-card, .news-card, .match-item, .stat-item {
                transition: all 0.25s ease;
            }
            .player-card:hover .player-nick {
                text-shadow: 0 0 5px cyan;
            }
            .player-card:hover .player-flag {
                transform: scale(1.1);
                transition: transform 0.2s ease;
            }
        `;
        document.head.appendChild(style);
    }

    // Плавный параллакс вихря
    function initParallax() {
        document.addEventListener('mousemove', (e) => {
            const bg = document.querySelector('.vortex-bg');
            if (bg) {
                const x = (e.clientX / window.innerWidth) * 20;
                const y = (e.clientY / window.innerHeight) * 20;
                bg.style.transform = `translate(${x * 0.03}px, ${y * 0.03}px)`;
            }
        });
    }

    function init() {
        renderRoster();
        renderNews();
        renderMatches();
        renderStats();
        setupSponsorButton();
        setDynamicStyles();
        initParallax();
    }

    init();
</script>
</body>
</html>
